<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>叡智の魔導書 Ver.17.0α</title>
    <style>
        :root {
            --bg-paper: #f8f1e7;
            --ink: #2c1e14;
            --gold: #b08d57;
            --accent: #5a7d6a;
            --fav-red: #d66d67;
        }
        body {
            background-color: #2c1e14;
            font-family: sans-serif;
            margin: 0; padding: 0;
            color: var(--ink);
            display: flex; flex-direction: column; height: 100vh;
        }
        /* --- ヘッダー・検索 --- */
        header {
            background: var(--bg-paper);
            padding: 10px;
            border-bottom: 2px solid var(--gold);
            flex-shrink: 0;
        }
        .search-container { display: flex; gap: 8px; }
        #search-box { flex-grow: 1; padding: 10px; border: 1px solid var(--gold); border-radius: 20px; }

        /* --- タブ切り替え --- */
        .tab-bar {
            display: flex; overflow-x: auto;
            background: #e9dcc0; border-bottom: 1px solid var(--gold);
            white-space: nowrap; scrollbar-width: none;
        }
        .tab-btn {
            padding: 12px 20px; border: none; background: none;
            cursor: pointer; font-weight: bold; font-size: 0.9rem;
        }
        .tab-btn.active { background: var(--bg-paper); border-top: 3px solid var(--gold); }

        /* --- メインコンテンツ（タイルエリア） --- */
        main {
            flex-grow: 1; overflow-y: auto;
            background: var(--bg-paper); padding: 10px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px; align-content: flex-start;
        }
        .tile {
            background: white; border: 1px solid #ddd; border-radius: 4px;
            padding: 10px 5px; text-align: center; cursor: pointer;
            font-size: 0.8rem; transition: 0.1s; display: flex; flex-direction: column;
        }
        .tile:active { transform: scale(0.95); background: #f0f0f0; }
        .tile .en { font-size: 0.6rem; color: #888; margin-top: 4px; }

        /* --- 調整用コンソール（ポップアップ風） --- */
        #console {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; border: 2px solid var(--gold); padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 100; display: none;
            width: 80%; max-width: 300px; border-radius: 8px;
        }

        /* --- 下部詠唱台（可変） --- */
        footer {
            background: white; border-top: 2px solid var(--gold);
            padding: 10px; flex-shrink: 0; transition: height 0.3s;
            position: relative;
        }
        #output-area {
            width: 100%; height: 40px; border: 1px solid #ccc;
            padding: 8px; box-sizing: border-box; font-family: monospace;
            resize: none; transition: height 0.3s;
        }
        #output-area.expanded { height: 150px; }
        .footer-btns { display: flex; gap: 5px; margin-top: 5px; }
        button.footer-btn { flex: 1; padding: 8px; font-size: 0.7rem; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div class="search-container">
        <input type="text" id="search-box" placeholder="日本語で検索（例: かみ）" oninput="filterTiles()">
        <button onclick="toggleDict()" style="border-radius:20px; border:1px solid var(--gold); padding:0 15px;">＋</button>
    </div>
</header>

<div class="tab-bar" id="tab-bar"></div>

<main id="tile-area"></main>

<!-- 調整コンソール -->
<div id="console">
    <h3 id="console-title" style="margin-top:0; font-size:1rem;"></h3>
    <label style="font-size:0.8rem;">色/質感:</label>
    <select id="console-sub" style="width:100%; margin: 5px 0 10px;"></select>
    <label style="font-size:0.8rem;">強調:</label>
    <input type="number" id="console-weight" step="0.1" value="1.0" style="width:100%; margin: 5px 0 10px;">
    <button onclick="commitTag()" style="width:100%; padding:10px; background:var(--accent); color:white; border:none; border-radius:4px;">確定</button>
    <button onclick="closeConsole()" style="width:100%; margin-top:5px; background:none; border:none; color:gray;">キャンセル</button>
</div>

<footer>
    <textarea id="output-area" readonly onclick="expandOutput()"></textarea>
    <div class="footer-btns">
        <button class="footer-btn" style="background:#4a6fa5; color:white;" onclick="copyOutput()">コピー</button>
        <button class="footer-btn" style="background:#8e9aaf; color:white;" onclick="resetOutput()">クリア</button>
        <button class="footer-btn" style="background:var(--fav-red); color:white;" onclick="openFavList()">お気に入りリスト</button>
    </div>
</footer>

<script>
// --- プロトタイプ用データ ---
const categories = ["演出", "顔・体", "髪", "衣装", "ポーズ", "背景"];
const masterData = [
    { cat: "髪", jp: "ポニーテール", en: "ponytail" },
    { cat: "髪", jp: "ツインテール", en: "twintails" },
    { cat: "髪", jp: "アホ毛", en: "ahoge" },
    { cat: "顔・体", jp: "笑顔", en: "happy" },
    { cat: "顔・体", jp: "ウインク", en: "wink" },
    { cat: "衣装", jp: "セーラー服", en: "sailor uniform" },
    { cat: "衣装", jp: "ドレス", en: "dress" },
    { cat: "演出", jp: "逆光", en: "back lighting" }
];
const subOptions = ["指定なし", "赤", "青", "黒", "白", "長い", "短い", "光沢"];

let currentTab = "髪";
let activeTag = null;

function init() {
    const tabBar = document.getElementById('tab-bar');
    categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${cat === currentTab ? 'active' : ''}`;
        btn.textContent = cat;
        btn.onclick = () => switchTab(cat);
        tabBar.appendChild(btn);
    });
    
    const subSel = document.getElementById('console-sub');
    subOptions.forEach(opt => subSel.add(new Option(opt, opt === "指定なし" ? "" : opt)));
    
    renderTiles();
}

function switchTab(cat) {
    currentTab = cat;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.textContent === cat));
    renderTiles();
}

function renderTiles(filter = "") {
    const area = document.getElementById('tile-area');
    area.innerHTML = "";
    const list = masterData.filter(d => (filter === "" ? d.cat === currentTab : d.jp.includes(filter) || d.en.includes(filter)));
    
    list.forEach(item => {
        const t = document.createElement('div');
        t.className = "tile";
        t.innerHTML = `<span class="jp">${item.jp}</span><span class="en">${item.en}</span>`;
        t.onclick = () => openConsole(item);
        area.appendChild(t);
    });
}

function filterTiles() {
    const query = document.getElementById('search-box').value;
    renderTiles(query);
}

function openConsole(item) {
    activeTag = item;
    document.getElementById('console-title').textContent = item.jp;
    document.getElementById('console').style.display = "block";
}

function closeConsole() {
    document.getElementById('console').style.display = "none";
}

function commitTag() {
    const sub = document.getElementById('console-sub').value;
    const weight = document.getElementById('console-weight').value;
    let res = sub ? `${sub} ${activeTag.en}` : activeTag.en;
    if (weight !== "1.0" && weight !== "1") res = `(${res}:${weight})`;
    
    const out = document.getElementById('output-area');
    out.value += (out.value ? ", " : "") + res;
    closeConsole();
}

function expandOutput() {
    document.getElementById('output-area').classList.toggle('expanded');
}

function copyOutput() {
    const out = document.getElementById('output-area');
    navigator.clipboard.writeText(out.value).then(() => alert("コピーしたで！"));
}

function resetOutput() {
    if(confirm("クリアするで？")) document.getElementById('output-area').value = "";
}

// ダミー
function toggleDict() { alert("外典登録（未実装）"); }
function openFavList() { alert("お気に入りリスト（未実装）"); }

init();
</script>
</body>
</html>
