<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>叡智の魔導書《アトモソフィア・グリモワール》</title>
    <style>
        :root {
            --bg-paper: #f4ecd8;
            --ink-color: #2c1e14;
            --accent-gold: #b08d57;
            --dust-red: #a0522d;
            --trash-pink: #ffafcc;
            --btn-hover: #d4a373;
        }
        body {
            background-color: #3d2b1f;
            background-image: url('https://www.transparenttextures.com/patterns/dark-leather.png');
            font-family: "Sawarabi Mincho", serif;
            color: var(--ink-color);
            margin: 0; padding: 10px;
            display: flex; justify-content: center;
        }
        .book-container {
            max-width: 1000px; width: 100%;
            background-color: var(--bg-paper);
            background-image: url('https://www.transparenttextures.com/patterns/parchment.png');
            padding: 30px 20px;
            border-radius: 3px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            border-left: 10px solid #5a3e2b;
        }
        h1 { text-align: center; border-bottom: 1px solid var(--accent-gold); padding-bottom: 10px; font-size: 1.4rem; margin: 0; }
        .subtitle { display: block; font-size: 0.9rem; letter-spacing: 0.2rem; margin-top: 5px; color: var(--accent-gold); }
        .section-label { font-weight: bold; font-size: 0.8rem; margin: 15px 0 5px 0; border-left: 4px solid var(--accent-gold); padding-left: 10px; }
        .input-group { background: rgba(0,0,0,0.03); padding: 12px; border: 1px solid rgba(176,141,87,0.3); border-radius: 4px; }
        select, input, textarea { width: 100%; padding: 12px; margin-bottom: 8px; background-color: rgba(255,255,255,0.7); border: 1px solid var(--accent-gold); font-family: inherit; box-sizing: border-box; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        button { padding: 12px; border: none; cursor: pointer; font-weight: bold; font-family: inherit; border-radius: 2px; font-size: 0.85rem; transition: all 0.2s ease; }
        .btn-add { background-color: var(--accent-gold); color: white; }
        .btn-add:active { background-color: var(--btn-hover); transform: translateY(2px); }
        .btn-build { background-color: #5a7d6a; color: white; }
        .btn-undo { background-color: #8e9aaf; color: white; }
        .storage-wrapper { display: grid; grid-template-columns: 1fr 100px; gap: 12px; margin: 10px 0; }
        #stock-area { min-height: 180px; border: 1px dashed var(--accent-gold); padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; background: rgba(255,255,255,0.2); align-content: flex-start; }
        #trash-bin { background-color: var(--dust-red); border: 2px solid var(--ink-color); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; border-radius: 4px; transition: all 0.2s; min-height: 180px; }
        #trash-bin.drag-over { background-color: var(--trash-pink); color: var(--dust-red); transform: scale(1.05); }
        .stock-item { background: #e9dcc0; border: 1px solid var(--accent-gold); padding: 8px 12px; font-size: 0.75rem; cursor: grab; user-select: none; }
        .stock-item.selected { background: var(--ink-color); color: var(--bg-paper); }
        #final-output { background: rgba(255,255,255,0.8); padding: 15px; border: 1px double var(--accent-gold); min-height: 120px; font-size: 1rem; line-height: 1.4; resize: vertical; }
    </style>
</head>
<body>

<div class="book-container">
    <h1>叡智の魔導書<br><span class="subtitle">《 アトモソフィア ・ グリモワール 》</span></h1>

    <div class="section-label">主軸の刻印</div>
    <div class="input-group">
        <select id="m1" onchange="syncM2()"></select>
        <select id="m2" onchange="syncM3()"></select>
        <select id="m3"></select>
    </div>

    <div class="section-label">属性の調律</div>
    <div class="input-group">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <select id="s1" onchange="syncS2()"></select>
            <select id="s2"></select>
        </div>
        <input type="number" id="weight" step="0.1" value="1.0" style="margin-top:10px;">
    </div>

    <div class="btn-grid">
        <button class="btn-add" onclick="pushStock()">一時記憶へ保存</button>
        <button class="btn-build" onclick="build()">パッケージ化</button>
    </div>

    <div class="section-label">一時記憶庫</div>
    <div class="storage-wrapper">
        <div id="stock-area"></div>
        <div id="trash-bin"><div style="font-size:2rem">🗑</div><div>抹消</div></div>
    </div>

    <div class="section-label">紡がれた呪文（詠唱台）</div>
    <textarea id="final-output"></textarea>
    
    <div class="btn-grid">
        <button class="btn-undo" onclick="undo()">一つ戻す</button>
        <button class="btn-add" style="background-color:#4a6fa5;" onclick="copyAndClear()">コピー ＆ 浄化</button>
    </div>
</div>

<script>

const master = {

        "目の形": { "閉じ目": "closed eyes", "片目閉じ": "one eye closed", "細め": "narrowed eyes", "目を細める": "squinting", "半開き": "half-closed eyes", "見開き": "wide-eyed", "ツリ目": "tsurime", "タレ目": "tareme", "ジト目": "jitome", "寄り目": "cross-eyed", "左右非対称": "uneven eyes" },
        "瞳の形・輝き": { "スリット": "slit pupils", "リング目": "ringed eyes", "ぐるぐる目": "spiral-only eyes", "ハート瞳": "heart-shaped pupils", "星瞳": "star-shaped pupils", "記号瞳": "symbol-shaped pupils", "塗りつぶし": "solid circle eyes", "虚ろ": "empty eyes", "反射(単)": "eye reflection", "反射(複)": "eyes reflection", "発光": "glowing eyes", "キラキラ": "sparkling eyes" },
        "表情(ポジティブ)": { "笑顔": "happy", "ドヤ顔": "smug", "ニヤリ": "smirk", "悪い笑み": "evil grin", "興奮": "excited", "生意気": "naughty face", "舌出し": "tongue out" },

        "表情(驚・恐・照)": { "驚き": "surprised", "怖い": "scared", "恐怖": "horrified", "パニック": "panicking", "照れ": "blush", "照れステッカー": "blush stickers", "赤面(全体)": "full-face blush", "赤面(鼻)": "nose blush", "恥ずかしい": "embarrassed", "狼狽": "flustered" },
        "表情(口・他)": { "口開け": "open mouth", "口閉じ": "closed mouth", "半開き唇": "parted lips", "波打ち口": "wavy mouth", "ダイヤ口": "diamond mouth", "三角口": "triangle mouth", "無表情": "expressionless", "疲労": "exhausted", "顔を覆う": "facepalm", "眠い": "sleepy", "ため息": "sigh", "真剣": "serious", "決意": "determined" }
    },

        "パーツ": { "アホ毛": "ahoge", "もみあげ": "sidelocks", "三つ編み": "braid", "お団子": "bun", "サイドバン": "side bun", "ハーフアップ": "half updo", "ハーフアップブレイド": "half up braid", "レイヤード": "layered hair" }
    },
    "4.衣装(頭・上)": {
        "頭部": { "野球帽": "baseball cap", "ビーニー": "beanie", "バケットハット": "bucket hat", "ベレー帽": "beret", "ストローハット": "straw hat", "シルクハット": "top hat", "サンタ帽": "Santa Claus hat", "魔女帽": "witch hat", "カチューシャ": "headband", "バンダナ": "bandana", "冠": "crown", "ティアラ": "tiara", "ヘアリボン": "hair ribbon", "ヘアピン": "hairpin", "シュシュ": "hair scrunchie" },
        "トップス": { "Tシャツ": "t-shirt", "ワイシャツ": "dress shirt", "タンクセット": "tank top", "クロップド": "crop top", "フリルシャツ": "frilled shirt", "キャミソール": "camisole", "ホルターネック": "halterneck", "オフショル": "off-shoulder shirt", "チューブトップ": "tube top", "セーター": "sweater", "リブセーター": "ribbed sweater", "タートルネック": "sleeveless turtleneck", "カーディガン": "cardigan", "コルセット": "corset" }
    },
    "5.衣装(下・全・外・足)": {
        "ボトムス": { "パンツ": "pants", "ジーンズ": "jeans", "レギンス": "leggings", "ショーツ": "shorts", "ミニスカート": "miniskirt", "ロングスカート": "long skirt", "プリーツスカート": "pleated skirt", "チェックスカート": "plaid skirt", "オーバーオール": "overall skirt" },
        "全身・アウター": { "ドレス": "dress", "セーラー服": "japanese schoolgirl sailor uniform", "ビジネススーツ": "business suit", "和服": "kimono", "浴衣": "yukata", "ブレザー": "blazer", "パーカー": "hoodie", "コート": "coat", "ロングコート": "long coat", "ケープ": "cape", "ローブ": "robe" },
        "靴・靴下": { "ブーツ": "boots", "ニーハイブーツ": "knee boots", "パンプス": "pumps", "ハイヒール": "high heels", "ローファー": "loafers", "スニーカー": "sneakers", "サイハイ": "thighhighs", "ニーハイ": "kneehighs", "ソックス": "socks", "ルーズソックス": "loose socks", "タイツ": "pantyhose" }
    },
    "6.ポーズ(身体)": {
        "全身": { "立ち": "standing", "座り": "sitting", "歩き": "walking", "走り": "running", "寝そべり": "lying", "仰向け": "on back", "うつ伏せ": "on stomach", "膝立ち": "kneeling", "片膝立ち": "on one knee", "しゃがみ": "squatting", "足組み": "crossed legs", "体育座り": "fetal position", "正座": "seiza", "割り座": "wariza", "横座り": "yokozuwari", "ジャンプ": "jumping", "ヨガ": "yoga", "お辞儀": "bowing" },
        "腕・足": { "腕上げ": "arm up", "頭の後ろで腕": "arm behind head", "後ろ手": "arm behind back", "腕組み": "crossed arms", "Tポーズ": "t-pose", "足上げ": "leg up", "足を揃える": "legs together", "開脚": "spread legs", "つま先立ち": "tiptoes" },
        "頭・特殊": { "俯き": "head down", "首傾げ": "head tilt", "仰け反り": "head back", "猫ポーズ": "cat pose", "お嬢様ポーズ": "ojou-sama pose", "ヴィランポーズ": "villain pose", "幽霊ポーズ": "ghost pose" }
    },
    "7.ポーズ(手・腕)": {
        "基本・指差し": { "拳": "raised fist", "指差し": "pointing", "自分を指す": "pointing at self", "上に指差し": "pointing up", "シーッ": "shushing", "サムズアップ": "thumbs up", "敬礼": "salute", "手を振る": "waving", "ハイタッチ": "hand up" },
        "顔・髪を触る": { "頬に指": "finger to cheek", "口に指": "finger to mouth", "頭をかく": "scratching head", "髪を弄る": "playing with own hair", "髪を耳にかける": "tucking hair", "顔を覆う": "covering face", "頬杖": "hand on own cheek", "顎に手": "hand on own chin" },
        "体・他": { "腰に手": "hand on own hip", "胸に手": "hand on own chest", "ポケットに手": "hand in pocket", "スカートを持つ": "hold one's skirt out", "ハート手": "heart hands", "恋人繋ぎ": "interlocked fingers", "ピース": "peace sign", "ギャルピース": "gyaru peace sign" }
    },
    "8.背景": {
        "景色・場所": { "海": "ocean", "砂浜": "beach", "川": "river", "森": "forest", "山": "mountain", "街": "city", "夜景": "cityscape", "教室": "classroom", "図書室": "library", "カフェ": "cafe", "屋上": "rooftop", "青空": "blue sky", "夕焼け": "sun set sky", "星空": "starry sky", "廃墟": "ruins" },
        "イラスト・柄": { "白背景": "white background", "単色背景": "simple background", "グラデーション": "gradient background", "ドット柄": "polka dot background", "格子柄": "checkered background", "ストライプ": "striped background", "ハート背景": "heart background", "水彩風": "watercolor background" }
    },
    "9.パース・光": {
        "パース": { "通常": "perspective", "空気遠近法": "atmospheric perspective", "魚眼": "fisheye", "パノラマ": "panorama", "消失点(1)": "vanishing point", "消失点(2)": "two vanishing point", "消失点(3)": "three vanishing point" },
        "エフェクト": { "ボケ": "bokeh", "被写体深度": "depth of field", "逆光": "back lighting", "順光": "front lighting", "拡散光": "diffused light", "霧": "foggy", "レンズフレア": "lens flare" }
    }

const subs = {
    "指定なし": { "----": "----" },
    "否定形": { "なし": "less" },
    "大きさ・長さ・厚さ": { "とても長い": "very long", "長い": "long", "短い": "short", "とても短い": "very short", "とても大きい": "very large", "大きい": "large", "小さい": "small", "とても小さい": "very small", "厚い": "thick", "薄い": "thin" },
    "質感・素材": { "レザー": "leather", "シルク": "silk", "リネン": "linen", "ビニール": "vinyl", "ゴム": "rubber", "リブ編み": "ribbed knit", "レース": "lace", "金属": "metallic", "光沢": "shiny", "濡れ": "wet" },
    "カラー(通常)": { "赤": "red", "青": "blue", "黄": "yellow", "緑": "green", "桃": "pink", "黒": "black", "白": "white", "橙": "orange", "紫": "purple", "茶": "brown" },
    "カラー(暗い)": { "暗赤": "dark red", "紺": "navy blue", "深緑": "dark green", "焦げ茶": "dark brown", "マルーン": "maroon" },
    "カラー(明るい)": { "明赤": "light red", "空色": "sky blue", "ライム": "light green", "パステルピンク": "light pink", "パステルカラー": "pastel color" }
};

let stockItems = [];
let undoLog = [];

function init() {
    const m1 = document.getElementById('m1');
    for (let k in master) m1.add(new Option(k, k));
    const s1 = document.getElementById('s1');
    for (let k in subs) s1.add(new Option(k, k));
    document.getElementById('final-output').value = DEFAULT_PROMPT;
    syncM2(); syncS2(); setupDragAndDrop();
}

function syncM2() {
    const v1 = document.getElementById('m1').value;
    const m2 = document.getElementById('m2');
    m2.innerHTML = "";
    for (let k in master[v1]) m2.add(new Option(k, k));
    syncM3();
}

function syncM3() {
    const v1 = document.getElementById('m1').value;
    const v2 = document.getElementById('m2').value;
    const m3 = document.getElementById('m3');
    m3.innerHTML = "";
    for (let k in master[v1][v2]) m3.add(new Option(k, master[v1][v2][k]));
}

function syncS2() {
    const v1 = document.getElementById('s1').value;
    const s2 = document.getElementById('s2');
    s2.innerHTML = "";
    for (let k in subs[v1]) s2.add(new Option(k, subs[v1][k]));
}

function pushStock() {
    const m = document.getElementById('m3').value;
    const s = document.getElementById('s2').value;
    const w = document.getElementById('weight').value;
    const finalSub = (s === "----") ? "" : s;
    stockItems.push({ m, s: finalSub, w, id: Date.now() });
    drawStock();
}

function drawStock() {
    const area = document.getElementById('stock-area');
    area.innerHTML = "";
    stockItems.forEach(item => {
        const d = document.createElement('div');
        d.className = "stock-item";
        d.draggable = true;
        d.dataset.id = item.id;
        let labelText = !item.s ? item.m : (item.s === "less" ? item.m + " " + item.s : item.s + " " + item.m);
        d.textContent = labelText;
        d.onclick = () => d.classList.toggle('selected');
        area.appendChild(d);
        d.addEventListener('dragstart', (e) => {
            d.classList.add('dragging');
            e.dataTransfer.setData('text/plain', item.id);
        });
        d.addEventListener('dragend', () => d.classList.remove('dragging'));
    });
}

function build() {
    const sels = Array.from(document.querySelectorAll('.stock-item.selected'));
    if (sels.length === 0) return;
    undoLog.push({ stock: JSON.parse(JSON.stringify(stockItems)), output: document.getElementById('final-output').value });
    let words = [];
    sels.forEach(el => {
        const it = stockItems.find(item => item.id == el.dataset.id);
        let word = !it.s ? it.m : (it.s === "less" ? it.m + " " + it.s : it.s + " " + it.m);
        if (it.w !== "1.0" && it.w !== "1") word = `(${word}:${it.w})`;
        words.push(word);
    });
    const currentVal = document.getElementById('final-output').value;
    const glue = (currentVal.trim() === "" || currentVal.trim().endsWith(",")) ? "" : ", ";
    document.getElementById('final-output').value = currentVal + glue + words.join(", ") + ", ";
    const sIds = sels.map(el => el.dataset.id);
    stockItems = stockItems.filter(it => !sIds.includes(String(it.id)));
    drawStock();
}

function undo() {
    if (undoLog.length === 0) return;
    const lastState = undoLog.pop();
    stockItems = lastState.stock;
    document.getElementById('final-output').value = lastState.output;
    drawStock();
}

function copyAndClear() {
    const output = document.getElementById('final-output');
    if (!output.value) return;
    navigator.clipboard.writeText(output.value).then(() => {
        alert("呪文を継承しました。詠唱台を清浄化します。");
        output.value = DEFAULT_PROMPT;
        stockItems = [];
        drawStock();
    });
}

function setupDragAndDrop() {
    const area = document.getElementById('stock-area');
    const bin = document.getElementById('trash-bin');
    area.addEventListener('dragover', e => e.preventDefault());
    bin.addEventListener('dragover', e => { e.preventDefault(); bin.classList.add('drag-over'); });
    bin.addEventListener('dragleave', () => bin.classList.remove('drag-over'));
    bin.addEventListener('drop', e => {
        e.preventDefault(); bin.classList.remove('drag-over');
        const id = e.dataTransfer.getData('text/plain');
        stockItems = stockItems.filter(it => it.id != id);
        drawStock();
    });
}
init();
</script>
</body>
</html>
