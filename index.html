<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root { --bg: #f4f7f6; --card: #ffffff; --primary: #2c3e50; --accent: #3498db; }
        body { font-family: 'Helvetica Neue', Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; background: var(--bg); color: #333; padding: 10px; margin: 0; }
        .container { max-width: 600px; margin: auto; background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { text-align: center; font-size: 1.4rem; margin-bottom: 20px; color: var(--primary); border-bottom: 2px solid var(--accent); padding-bottom: 10px; }
        .group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.85rem; color: #555; }
        .input-row { display: flex; gap: 8px; flex-wrap: wrap; }
        select { flex: 1; min-width: 150px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.95rem; background: #fff; appearance: none; cursor: pointer; }
        .weight-input { width: 70px; text-align: center; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
        @media (max-width: 480px) {
            .input-row { flex-direction: column; }
            .weight-input, select { width: 100%; }
        }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        button { padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
        .btn-add { background: var(--accent); color: white; }
        .btn-copy { background: #27ae60; color: white; }
        .btn-reset { background: #e74c3c; color: white; grid-column: span 2; }
        button:active { transform: scale(0.95); opacity: 0.8; }
        #result-area { 
            margin-top: 20px; padding: 15px; background: #fefefe; border-radius: 8px; 
            border: 2px dashed #bdc3c7; min-height: 80px; word-break: break-all; 
            font-size: 0.9rem; line-height: 1.5; color: #2c3e50;
        }
    </style>
</head>

<div class="container">
    <h1>🪄 AIプロンプト完全魔導書</h1>

    <div class="group">
        <label>カテゴリ選択</label>
        <select id="category-select" onchange="updateSubCategory()"></select>
    </div>

    <div class="group">
        <label>呪文選択</label>
        <div class="input-row">

            <input type="number" id="weight" class="weight-input" step="0.1" value="1.0" min="0.1" max="2.0">
        </div>
    </div>

    <div class="controls">
        <button class="btn-add" onclick="addSpell()">追加</button>
        <button class="btn-copy" onclick="copyPrompt()">コピー</button>
        <button class="btn-reset" onclick="resetPrompt()">リセット</button>
    </div>

    <div id="result-area"></div>
</div>

        }

    let selectedPrompts = [];
    const catSelect = document.getElementById('category-select');

    // カテゴリの初期化
    for (let cat in spellData) {
        let newOpt = document.createElement('option');
        newOpt.value = cat;
        newOpt.textContent = cat;
        catSelect.appendChild(newOpt);
    }

    // サブカテゴリ（呪文）の更新
    function updateSubCategory() {
        const cat = catSelect.value;
        const spellSelect = document.getElementById('spell-select');
        spellSelect.innerHTML = '';
        for (let name in spellData[cat]) {
            let opt = document.createElement('option');
            opt.value = spellData[cat][name];
            opt.textContent = name;
            spellSelect.appendChild(opt);
        }
    }

    function addSpell() {
        const val = document.getElementById('spell-select').value;
        const weight = document.getElementById('weight').value;
        const formatted = weight === "1.0" ? val : `(${val}:${weight})`;
        selectedPrompts.push(formatted);
        updateResult();
    }

    function updateResult() {
        document.getElementById('result-area').textContent = selectedPrompts.join(', ');
    }

    function copyPrompt() {
        const text = document.getElementById('result-area').textContent;
        if(!text) return;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.querySelector('.btn-copy');
            const originalText = btn.textContent;
            btn.textContent = 'コピー成功！';
            setTimeout(() => btn.textContent = originalText, 1500);
        });
    }

    function resetPrompt() {
        if(confirm('リセットしてええんか？')) {
            selectedPrompts = [];
            updateResult();
        }
    }

    // 起動時に最初のカテゴリを表示
    updateSubCategory();
</script>

</html>
