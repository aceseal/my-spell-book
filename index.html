<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Arcane Console</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --accent-color: #4ecca3;
            --text-color: #e94560;
            --sub-text: #ffffff;
        }

        body { background-color: var(--bg-color); color: var(--sub-text); font-family: sans-serif; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: var(--accent-color); text-align: center; margin-bottom: 20px; }

        /* --- 入力行のデザイン --- */
        .prompt-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
        }

        select { flex: 2; padding: 10px; border-radius: 8px; background: #0f3460; color: white; border: none; }
        input[type="text"] { flex: 1; padding: 10px; border-radius: 8px; background: #0f3460; color: white; border: 1px solid #4ecca3; text-align: center; }

        /* --- ボタン類 --- */
        .btn-add { background: #4ecca3; color: #1a1a2e; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 24px; cursor: pointer; margin: 10px auto; display: block; }
        .btn-generate { width: 100%; padding: 15px; border-radius: 12px; border: none; background: linear-gradient(45deg, #4ecca3, #45b7d1); color: #1a1a2e; font-weight: bold; margin-top: 10px; }
        
        #output { background: rgba(15, 52, 96, 0.8); padding: 15px; border-radius: 10px; border: 1px dashed var(--accent-color); min-height: 60px; margin: 20px 0; word-break: break-all; color: #a2d2ff; font-size: 0.9rem; }
        .btn-copy { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--accent-color); background: transparent; color: var(--accent-color); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Arcane Console v2</h2>
            
            <!-- 呪文パーツを追加していくエリア -->
            <div id="prompt-list">
                <!-- 初期パーツ（例として画風） -->
                <div class="prompt-row">
                    <select class="p-word">
                        <option value="">-- カテゴリ選択 --</option>
                        <optgroup label="画風">
                            <option value="modern anime style">現代アニメ</option>
                            <option value="vibrant soft pastel colors">透明感パステル</option>
                        </optgroup>
                        <optgroup label="髪型">
                            <option value="messy hair">無造作ヘア</option>
                            <option value="ponytail">ポニーテール</option>
                            <option value="twintails">ツインテール</option>
                        </optgroup>
                        <optgroup label="瞳">
                            <option value="blue eyes">青い瞳</option>
                            <option value="red eyes">赤い瞳</option>
                            <option value="sparkling eyes">輝く瞳</option>
                        </optgroup>
                    </select>
                    <input type="text" class="p-weight" placeholder="1.2" value="1.2">
                </div>
            </div>

            <button class="btn-add" onclick="addRow()">＋</button>
            <button class="btn-generate" onclick="generate()">呪文を紡ぐ</button>
            
            <div id="output">呪文を紡いでください...</div>
            
            <button class="btn-copy" onclick="copyText()">コピーして詠唱</button>
        </div>
    </div>

    <script>
        // 新しい行を追加する関数
        function addRow() {
            const list = document.getElementById('prompt-list');
            const newRow = list.firstElementChild.cloneNode(true);
            // 値をリセット
            newRow.querySelector('.p-word').value = "";
            newRow.querySelector('.p-weight').value = "1.2";
            list.appendChild(newRow);
        }

        function generate() {
            const words = document.querySelectorAll('.p-word');
            const weights = document.querySelectorAll('.p-weight');
            let result = "(Masterpiece, top quality:1.2), 1girl";

            words.forEach((word, index) => {
                const val = word.value;
                const weight = weights[index].value || "1.0";
                if(val) {
                    result += `, (${val}:${weight})`;
                }
            });

            document.getElementById('output').innerText = result;
        }

        function copyText() {
            const text = document.getElementById('output').innerText;
            navigator.clipboard.writeText(text);
            alert("魔導書に記録したで！");
        }
    </script>
</body>
</html>
