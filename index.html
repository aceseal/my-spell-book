<html lang="ja">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#3d2b1f">

    <title>叡智の魔導書 Ver.19.1</title>
    <style>
        :root {
            /* ベース色 */
            --bg-paper: #f4ecd8; 
            --ink: #2c1e14; 
            --gold: #b08d57; 
            --tab-inactive: #e9dcc0;
            --user-navy: #2c3e50; /* ユーザー追加タイル背景 */
            --user-white: #ffffff;/* ユーザー追加タイル文字 */
            /* フッター：出力操作 */
            --action-copy: #4a6fa5;   
            --action-clear: #d66d67;  
            --action-undo: #8e9aaf; 
            /* コンソール：反映と中断 */
            --console-commit: #5a7d6a; 
            --console-cancel: #bc7670; 
        }

        body { 
            background-color: #3d2b1f; font-family: sans-serif; margin: 0; padding: 0; 
            color: var(--ink); display: flex; flex-direction: column; height: 100vh; overflow: hidden; 
        }

        header { background: var(--bg-paper); padding: 12px; border-bottom: 2px solid var(--gold); flex-shrink: 0; }
        .search-container { display: flex; gap: 10px; }
        #search-box { flex-grow: 1; padding: 12px 18px; border: 1px solid var(--gold); border-radius: 25px; font-size: 0.9rem; }
        .btn-icon { background: var(--gold); color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; }

        .tab-wrapper { flex-shrink: 0; }
        .scroll-nav { display: flex; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
        .scroll-nav::-webkit-scrollbar { display: none; }
        
        .tab-bar { background: var(--tab-inactive); border-bottom: 1px solid var(--gold); }
        .tab-btn { padding: 12px 20px; border: none; background: none; font-weight: bold; font-size: 0.85rem; color: #5a3e2b; opacity: 0.6; }
        .tab-btn.active { opacity: 1; background: var(--bg-paper); border-bottom: 3px solid var(--gold); }
        
        .child-bar { background: #dfd3b8; padding: 5px 0; border-bottom: 1px solid rgba(0,0,0,0.1); }
        .child-btn { padding: 6px 12px; font-size: 0.75rem; border-radius: 15px; margin: 0 5px; border: 1px solid transparent; background: rgba(255,255,255,0.4); font-weight: bold; color: var(--ink); }
        .child-btn.active { background: var(--gold); color: white; }

        main { flex-grow: 1; overflow-y: auto; background: var(--bg-paper); padding: 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 10px; padding-bottom: 180px; }
        .tile { position: relative; background: rgba(255,255,255,0.6); border: 1px solid rgba(176,141,87,0.3); border-radius: 6px; padding: 12px 8px; text-align: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .tile .jp { display: block; font-weight: bold; font-size: 0.8rem; }
        .tile .en { display: block; font-size: 0.65rem; color: #777; font-style: italic; }
        .user-tile {background: var(--user-navy) !important; color: var(--user-white) !important; border: 1px solid rgba(255, 255, 255, 0.2) !important;}
        .user-tile .en {color: var(--user-white); opacity: 0.7;}
        
        #console-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; display: none; align-items: flex-end; }
        #console { width: 100%; background: var(--bg-paper); padding: 20px; border-radius: 20px 20px 0 0; border-top: 4px solid var(--gold); box-sizing: border-box; max-height: 85vh; overflow-y: auto; }
        .console-section { margin-bottom: 18px; }
        .console-label { font-size: 0.75rem; font-weight: bold; margin-bottom: 8px; display: block; color: var(--ink); border-left: 4px solid var(--gold); padding-left: 8px; }
        .console-label.active { color: var(--gold); }
        
        .chip-scroll { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 5px; scrollbar-width: thin; }
        .chip { padding: 8px 16px; background: #fff; border: 1px solid #ddd; border-radius: 20px; font-size: 0.8rem; white-space: nowrap; flex-shrink: 0; text-align: center; }
        .chip.active { background: var(--gold); color: white; border-color: var(--gold); }
        .chip small { display: block; font-size: 0.6rem; opacity: 0.7; }

        .drawer-nav { display: flex; gap: 5px; margin-bottom: 10px; overflow-x: auto; scrollbar-width: none; }
        .drawer-nav button { padding: 6px 12px; font-size: 0.7rem; border-radius: 5px; border: 1px solid var(--gold); background: #fff; white-space: nowrap; }
        .drawer-nav button.active { background: var(--gold); color: white; }

        .console-footer { display: flex; gap: 10px; margin-top: 15px; }
        .btn-commit { flex: 2; padding: 15px; background: var(--console-commit); color: white; border: none; border-radius: 8px; font-weight: bold; }
        .btn-cancel { flex: 1; padding: 15px; background: var(--console-cancel); color: white; border: none; border-radius: 8px; font-weight: bold; }

        footer { background: white; border-top: 2px solid var(--gold); padding: 10px; position: fixed; bottom: 0; width: 100%; box-sizing: border-box; z-index: 20; }
        .output-container { display: flex; flex-direction: column; gap: 5px; }
        .output-tab { display: flex; gap: 5px; }
        .output-tab button { flex: 1; padding: 6px; font-size: 0.7rem; border: 1px solid #ddd; background: #eee; border-radius: 4px 4px 0 0; }
        .output-tab button.active { background: var(--bg-paper); border-bottom: none; font-weight: bold; }
        
        textarea { width: 100%; height: 50px; border: 1px solid #ddd; padding: 8px; font-family: monospace; font-size: 0.85rem; background: #fafafa; border-radius: 0 0 4px 4px; resize: none; box-sizing: border-box; }
        .footer-btns { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 8px; margin-top: 8px; }
        .btn-action { padding: 12px; border: none; border-radius: 4px; font-weight: bold; font-size: 0.75rem; color: white; cursor: pointer; }

        /* 削除メニュー用CSS */
        .delete-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: flex-end; z-index: 1000; }
        .delete-menu { width: 100%; background: var(--bg-paper); padding: 20px; border-radius: 20px 20px 0 0; box-sizing: border-box; text-align: center; animation: slideUp 0.3s ease-out; border-top: 4px solid #e74c3c; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .delete-menu p { font-weight: bold; margin-bottom: 15px; color: var(--ink); }
        .btn-delete-confirm { width: 100%; padding: 15px; background: #e74c3c; color: white; border: none; border-radius: 10px; font-weight: bold; margin-bottom: 10px; }
        .btn-delete-cancel { width: 100%; padding: 15px; background: #ddd; color: var(--ink); border: none; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div class="search-container">
        <input type="text" id="search-box" placeholder="叡智を検索..." oninput="refreshDisplay()">
        <button class="btn-icon" onclick="openApocrypha()">✏️</button>
    </div>
</header>

<div class="tab-wrapper">
    <div class="tab-bar scroll-nav" id="p-tabs"></div>
    <div class="child-bar scroll-nav" id="c-tabs"></div>
</div>

<main id="tile-area"></main>

<div id="console-overlay" onclick="closeConsole()">
    <div id="console" onclick="event.stopPropagation()">
        <h3 id="console-title" style="margin:0 0 15px; text-align:center;"></h3>
        <div id="sec-tone" class="console-section"><span class="console-label" id="lbl-tone">色彩：トーン</span><div id="lst-tone" class="chip-scroll"></div></div>
        <div id="sec-color" class="console-section">
            <span class="console-label" id="lbl-color">色彩：ベース色</span>
            <div class="drawer-nav">
                <button onclick="drawColors('achromatic')" id="db-achromatic">無彩色</button>
                <button onclick="drawColors('warm')" id="db-warm">暖色</button>
                <button onclick="drawColors('cool')" id="db-cool">寒色</button>
                <button onclick="drawColors('metal')" id="db-metal">金属</button>
            </div>
            <div id="lst-color" class="chip-scroll"></div>
        </div>
        <div id="sec-length" class="console-section"><span class="console-label" id="lbl-length">形態：サイズ・長さ</span><div id="lst-length" class="chip-scroll"></div></div>
        <div id="sec-material" class="console-section"><span class="console-label" id="lbl-material">質感・材質</span><div id="lst-material" class="chip-scroll"></div></div>
        <div class="console-section">
            <span class="console-label">強調度 (Weight: <span id="weight-val">1.0</span>)</span>
            <input type="range" id="c-weight" min="0.5" max="2.0" step="0.1" value="1.0" oninput="document.getElementById('weight-val').textContent=this.value" style="width:100%;">
        </div>
        <div class="console-footer">
            <button class="btn-cancel" onclick="closeConsole()">戻る</button>
            <button class="btn-commit" onclick="commit()">詠唱台に反映</button>
        </div>
    </div>
</div>

<div id="delete-menu-overlay" class="delete-overlay" onclick="closeDeleteMenu()">
    <div class="delete-menu" onclick="event.stopPropagation()">
        <p id="delete-target-name"></p>
        <button class="btn-delete-confirm" onclick="executeDelete()">この外典を抹消する</button>
        <button class="btn-delete-cancel" onclick="closeDeleteMenu()">キャンセル</button>
    </div>
</div>

<footer>
    <div class="output-container">
        <div class="output-tab">
            <button id="tab-pos" class="active" onclick="switchOutput('pos')">叡智の呪文 (Positive)</button>
            <button id="tab-neg" onclick="switchOutput('neg')">叡智の対価 (Negative)</button>
        </div>
        <textarea id="pos-area" placeholder="呪文が紡がれます..."></textarea>
        <textarea id="neg-area" style="display:none;" placeholder="避けたい要素を入力..."></textarea>
    </div>
    <div class="footer-btns">
        <button class="btn-action" style="background: var(--action-copy);" onclick="copyOutput()">呪文を詠唱</button>
        <button class="btn-action" style="background: var(--action-clear);" onclick="resetOutput()">呪文を破棄</button>
        <button class="btn-action" style="background: var(--action-undo);" onclick="undo()">1つ戻る</button>
    </div>
</footer>

let negHistory = [];
let userList = [];
let currentMode = 'pos'; 
let longPressTimer;
let deleteTargetEn = null;
let isLongPress = false;

function buildCategories() {
    categories = {};
    masterData.forEach(item => {
        if (!categories[item.p]) categories[item.p] = new Set();
        if (item.c) categories[item.p].add(item.c);
    });
}

function init() {
    loadApocrypha();
    buildCategories();
    const order = ["おまじない", "演出", "身体", "髪型", "顔", "衣装", "ポーズ", "背景"];
    const pTabs = document.getElementById('p-tabs');
    pTabs.innerHTML = order.filter(p => categories[p]).map(p => 
        `<button class="tab-btn" onclick="setParent('${p}')" id="pb-${p}">${p}</button>`
    ).join('');
    if(order.length > 0) setParent(order[0]);
}

function setParent(p) {
    curP = p;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    if(document.getElementById(`pb-${p}`)) document.getElementById(`pb-${p}`).classList.add('active');
    const cs = Array.from(categories[p] || []);
    const cBar = document.getElementById('c-tabs');
    cBar.innerHTML = cs.map(c => `<button class="child-btn" onclick="setChild('${c}')" id="cb-${c}">${c}</button>`).join('');
    if (cs.length > 0) setChild(cs[0]); else { curC = ""; refreshDisplay(); }
}

function setChild(c) {
    curC = c;
    document.querySelectorAll('.child-btn').forEach(b => b.classList.remove('active'));
    if(document.getElementById(`cb-${c}`)) document.getElementById(`cb-${c}`).classList.add('active');
    refreshDisplay();
}

function refreshDisplay() {
    const q = document.getElementById('search-box').value.toLowerCase();
    const area = document.getElementById('tile-area');
    area.innerHTML = "";
    const filtered = masterData.filter(d => (q ? (d.jp.includes(q) || d.en.includes(q)) : (d.p === curP && d.c === curC)));
    
    filtered.forEach(item => {
        const t = document.createElement('div');
        t.className = item.isUser ? "tile user-tile" : "tile"; 
        t.innerHTML = `<span class="jp">${item.jp}</span><span class="en">${item.en}</span>`;

        // 長押しイベントの設定
        const startPress = (e) => {
            isLongPress = false;
            longPressTimer = setTimeout(() => {
                if (item.isUser) {
                    isLongPress = true;
                    openDeleteMenu(item);
                    if (navigator.vibrate) navigator.vibrate(50);
                }
            }, 800);
        };
        const endPress = () => clearTimeout(longPressTimer);

        t.oncontextmenu = (e) => { if(item.isUser) e.preventDefault(); }; // ブラウザメニュー抑止
        t.ontouchstart = startPress;
        t.ontouchend = endPress;
        t.onmousedown = startPress;
        t.onmouseup = endPress;
        t.onmouseleave = endPress;

        t.onclick = () => { if (!isLongPress) openConsole(item); };
        area.appendChild(t);
    });
}

function openDeleteMenu(item) {
    deleteTargetEn = item.en;
    document.getElementById('delete-target-name').innerText = `「${item.jp}」を削除しますか？`;
    document.getElementById('delete-menu-overlay').style.display = 'flex';
}
function closeDeleteMenu() { document.getElementById('delete-menu-overlay').style.display = 'none'; }
function executeDelete() {
    if (!deleteTargetEn) return;
    userList = userList.filter(i => i.en !== deleteTargetEn);
    const idx = masterData.findIndex(i => i.en === deleteTargetEn && i.isUser);
    if (idx !== -1) masterData.splice(idx, 1);
    saveApocrypha();
    buildCategories();
    refreshDisplay();
    closeDeleteMenu();
}

function updateTextarea() {
    const posText = posHistory.length > 0 ? posHistory.join(", ") + ", " : "";
    const negText = negHistory.length > 0 ? negHistory.join(", ") + ", " : "";
    document.getElementById('pos-area').value = posText;
    document.getElementById('neg-area').value = negText;
}
function commit() {
    const parts = [selAttr.tone, selAttr.color, selAttr.length, selAttr.material, activeItem.en].filter(x => x);
    const tagText = parts.join(" ");
    const w = parseFloat(document.getElementById('c-weight').value);
    const final = (w === 1) ? tagText : `(${tagText}:${w})`;
    if (currentMode === 'pos') posHistory.push(final); else negHistory.push(final);
    updateTextarea();
    closeConsole();
}
function undo() {
    if (currentMode === 'pos') { if (posHistory.length > 0) posHistory.pop(); }
    else { if (negHistory.length > 0) negHistory.pop(); }
    updateTextarea();
}
function resetOutput() {
    if(confirm("呪文を破棄しますか？")) {
        if (currentMode === 'pos') posHistory = []; else negHistory = [];
        updateTextarea();
    }
}
function openConsole(item) {
    activeItem = item;
    selAttr = { tone: "", color: "", length: "", material: "" };
    document.getElementById('console-title').innerText = item.jp;
    const show = item.attrs || [];
    ["tone", "color", "length", "material"].forEach(a => {
        document.getElementById(`sec-${a}`).style.display = show.includes(a) ? 'block' : 'none';
        updateLabel(a, "");
    });
    if (show.includes('tone')) renderChips('tone', attributes.tone);
    if (show.includes('color')) drawColors('achromatic');
    if (show.includes('length')) renderChips('length', attributes.length);
    if (show.includes('material')) renderChips('material', attributes.material);
    document.getElementById('c-weight').value = 1.0;
    document.getElementById('weight-val').innerText = "1.0";
    document.getElementById('console-overlay').style.display = "flex";
}
function renderChips(type, list) {
    const div = document.getElementById(`lst-${type}`);
    div.innerHTML = list.map(v => `<div class="chip" onclick="selectAttr('${type}','${v.en}','${v.jp}')" id="cp-${type}-${v.en}">${v.jp}<small>${v.en}</small></div>`).join('');
}
function drawColors(grp) {
    document.querySelectorAll('.drawer-nav button').forEach(b => b.classList.remove('active'));
    if(document.getElementById(`db-${grp}`)) document.getElementById(`db-${grp}`).classList.add('active');
    renderChips('color', attributes.color[grp]);
}
function selectAttr(type, en, jp) {
    const isOff = selAttr[type] === en;
    selAttr[type] = isOff ? "" : en;
    document.querySelectorAll(`#lst-${type} .chip`).forEach(c => c.classList.remove('active'));
    if(!isOff) {
        if(document.getElementById(`cp-${type}-${en}`)) document.getElementById(`cp-${type}-${en}`).classList.add('active');
        updateLabel(type, jp);
    } else { updateLabel(type, ""); }
}
function updateLabel(type, jp) {
    const lbl = document.getElementById(`lbl-${type}`);
    const base = {tone:"色彩：トーン", color:"色彩：ベース色", length:"形態：サイズ・長さ", material:"質感・材質"}[type];
    lbl.innerHTML = (jp && jp !== "通常") ? `${base}：<strong>${jp}</strong>` : base;
    lbl.classList.toggle('active', !!(jp && jp !== "通常"));
}
function copyOutput() {
    let posRaw = document.getElementById('pos-area').value.trim();
    let negRaw = document.getElementById('neg-area').value.trim();
    let arMatch = posRaw.match(/--ar\s[\d:]+/);
    let arPart = arMatch ? arMatch[0] : "";
    if (arPart) posRaw = posRaw.replace(arPart, "");
    const clean = (s) => s.replace(/,\s*,/g, ",").replace(/[,\s]+$/, "").trim();
    let pos = clean(posRaw);
    let neg = clean(negRaw);
    let result = (pos ? pos + "." : "") + (neg ? " Avoid: " + neg + "." : "");
    if (arPart) result += " Aspect ratio " + arPart.replace("--ar ", "") + ".";
    const finalMsg = result.replace(/\s+/g, " ").trim();
    navigator.clipboard.writeText(finalMsg).then(() => alert("呪文をコピーしました！"));
}
function switchOutput(mode) {
    currentMode = mode;
    document.getElementById('tab-pos').classList.toggle('active', mode === 'pos');
    document.getElementById('tab-neg').classList.toggle('active', mode === 'neg');
    document.getElementById('pos-area').style.display = mode === 'pos' ? 'block' : 'none';
    document.getElementById('neg-area').style.display = mode === 'neg' ? 'block' : 'none';
}
function closeConsole() { document.getElementById('console-overlay').style.display = "none"; }

function openApocrypha() {
    let en = prompt("【外典登録】英語名（例: neon glow）:");
    if (!en) return;
    let jp = prompt("【外典登録】日本語名（例: ネオンの輝き）:");
    if (!jp) return;
    const sample = masterData.find(d => d.p === curP && d.c === curC);
    const newItem = { p: curP, c: curC, jp: jp, en: en, attrs: (sample ? [...sample.attrs] : []), isUser: true };
    masterData.push(newItem);
    userList.push(newItem);
    saveApocrypha();
    buildCategories();
    refreshDisplay();
}
function saveApocrypha() { localStorage.setItem("myGrimoire_UserAdd", JSON.stringify(userList)); }
function loadApocrypha() {
    const saved = localStorage.getItem("myGrimoire_UserAdd");
    if (saved) {
        userList = JSON.parse(saved);
        userList.forEach(u => { if (!masterData.some(m => m.en === u.en)) masterData.push(u); });
    }
}

init();
</script>
</body>
