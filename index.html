<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>叡智の魔導書 - Prompt Grimoire</title>
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --panel-bg: #1e1e1e;
            --accent-gold: #d4af37;
            --cancel-red: #cc2222;
            --reflect-green: #228b22;
            --text-main: #e0e0e0;
            --text-dim: #888;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Georgia', serif; /* 魔導書っぽさを演出 */
            margin: 0;
            padding: 10px;
            overscroll-behavior: none;
        }

        h2 { text-align: center; color: var(--accent-gold); border-bottom: 2px solid var(--accent-gold); padding-bottom: 5px; }

        /* --- ナビゲーション（親子タブ） --- */
        .scroll-nav {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            gap: 10px;
            padding: 10px 0;
            scrollbar-width: none; /* Firefox */
        }
        .scroll-nav::-webkit-scrollbar { display: none; } /* Chrome/Safari */

        .nav-btn {
            background: #333;
            color: var(--text-main);
            border: 1px solid #555;
            padding: 8px 18px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .nav-btn.active {
            background: var(--accent-gold);
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 10px var(--accent-gold);
        }

        .parent-tabs { border-bottom: 1px solid #444; }
        .child-tabs { margin-top: 5px; min-height: 45px; }

        /* --- 単語タイルエリア --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 12px;
            margin: 15px 0;
        }
        .tag-tile {
            background: var(--panel-bg);
            border: 1px solid #444;
            padding: 12px 5px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .tag-tile:active { transform: scale(0.95); background: #333; }
        .tag-tile span { display: block; font-size: 14px; }
        .tag-tile small { font-size: 10px; color: var(--text-dim); }

        /* --- 詠唱台（結果表示） --- */
        .chant-wrap { position: sticky; bottom: 10px; background: rgba(15,15,15,0.9); padding: 10px; border-radius: 10px; border: 1px solid var(--accent-gold); }
        #chantArea {
            width: 100%; height: 60px;
            background: #000; color: #0f0;
            border: none; padding: 8px;
            box-sizing: border-box; resize: none; border-radius: 5px;
        }

        /* --- 補助コンソール（モーダル） --- */
        .modal {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.9);
            z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-content {
            background: var(--panel-bg); width: 90%; max-width: 450px;
            padding: 20px; border-radius: 15px; border: 1px solid var(--accent-gold);
        }

        .attr-section { margin-bottom: 15px; }
        .attr-label { font-size: 13px; color: var(--text-dim); margin-bottom: 5px; }
        .attr-label.bold { color: var(--accent-gold); font-weight: bold; }

        .drawer-nav { display: flex; gap: 5px; margin-bottom: 8px; }
        .drawer-nav button { font-size: 11px; padding: 4px 8px; border-radius: 3px; }

        .slider-box { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        input[type="range"] { flex: 1; accent-color: var(--accent-gold); }

        .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
        .btn-reflect { flex: 2; background: var(--reflect-green); color: white; border: none; padding: 12px; border-radius: 5px; font-weight: bold; }
        .btn-cancel { flex: 1; background: var(--cancel-red); color: white; border: none; border-radius: 5px; }

    </style>
</head>
<body>

    <h2>叡智の魔導書</h2>
    
    <div class="parent-tabs scroll-nav" id="pNav"></div>
    <div class="child-tabs scroll-nav" id="cNav"></div>
    
    <div class="grid-container" id="tagGrid"></div>

    <div class="chant-wrap">
        <textarea id="chantArea" readonly placeholder="ここに呪文が刻まれる..."></textarea>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h3 id="mTagName" style="margin-top:0; color:var(--accent-gold);">単語設定</h3>
            <hr style="border-color:#444;">
            
            <div id="toneSection" class="attr-section">
                <div class="attr-label" id="toneLabel">質感：未選択</div>
                <div class="scroll-nav" id="toneList"></div>
            </div>

            <div id="colorSection" class="attr-section">
                <div class="attr-label" id="colorLabel">色彩：未選択</div>
                <div class="drawer-nav">
                    <button onclick="drawColors('achromatic')">無彩色</button>
                    <button onclick="drawColors('warm')">暖色</button>
                    <button onclick="drawColors('cool')">寒色</button>
                    <button onclick="drawColors('metal')">金属</button>
                </div>
                <div class="scroll-nav" id="colorList"></div>
            </div>

            <div class="attr-section">
