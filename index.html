<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- アプリ化の設定（成功していた当時のまま） -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>叡智の魔導書 Ver.17.2</title>
    <style>
        :root {
            --bg-paper: #f4ecd8; --ink: #2c1e14; --gold: #b08d57; --accent: #5a7d6a; --fav-red: #d66d67; --tab-inactive: #e9dcc0;
        }
        body { background-color: #3d2b1f; font-family: sans-serif; margin: 0; padding: 0; color: var(--ink); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: var(--bg-paper); padding: 12px; border-bottom: 2px solid var(--gold); }
        .search-container { display: flex; gap: 10px; }
        #search-box { flex-grow: 1; padding: 12px 18px; border: 1px solid var(--gold); border-radius: 25px; font-size: 0.9rem; }
        .btn-icon { background: var(--gold); color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; }
        .tab-bar { display: flex; overflow-x: auto; background: var(--tab-inactive); border-bottom: 1px solid var(--gold); }
        .tab-btn { padding: 12px 20px; border: none; background: none; font-weight: bold; font-size: 0.85rem; color: #5a3e2b; }
        .tab-btn.active { background: var(--bg-paper); border-bottom: 3px solid var(--gold); }
        main { flex-grow: 1; overflow-y: auto; background: var(--bg-paper); padding: 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
        .tile { background: rgba(255,255,255,0.6); border: 1px solid rgba(176,141,87,0.3); border-radius: 6px; padding: 12px 8px; text-align: center; cursor: pointer; }
        .tile .jp { display: block; font-weight: bold; font-size: 0.8rem; }
        .tile .en { display: block; font-size: 0.65rem; color: #777; font-style: italic; }
        footer { background: white; border-top: 2px solid var(--gold); padding: 10px; }
        #output-area { width: 100%; height: 50px; border: 1px solid #ddd; padding: 10px; font-family: monospace; font-size: 0.9rem; background: #fafafa; }
        .footer-btns { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 8px; margin-top: 8px; }
        .btn-action { padding: 10px; border: none; border-radius: 4px; font-weight: bold; font-size: 0.75rem; color: white; }
    </style>
</head>
<body>
<header>
    <div class="search-container">
        <input type="text" id="search-box" placeholder="検索..." oninput="refreshDisplay()">
        <button class="btn-icon" onclick="openDictModal()">✏️</button>
    </div>
</header>
<div class="tab-bar" id="tab-bar"></div>
<main id="tile-area"></main>
<footer>
    <textarea id="output-area" readonly placeholder="呪文が紡がれます..."></textarea>
    <div class="footer-btns">
        <button class="btn-action" style="background:#4a6fa5;" onclick="copyOutput()">COPY</button>
        <button class="btn-action" style="background:#8e9aaf;" onclick="resetOutput()">CLEAR</button>
        <button class="btn-action" style="background:#d66d67;" onclick="saveToFav()">FAV</button>
    </div>
</footer>
<script>
// シンプルなVer.17.2のロジック（一部簡略化）
const baseCategories = ["演出", "顔・体", "髪", "衣装"];
const masterData = [{ cat: "衣装", jp: "オフショルダー", en: "off-shoulder" }];
function refreshDisplay() {
    const area = document.getElementById('tile-area'); area.innerHTML = "";
    masterData.forEach(item => {
        const t = document.createElement('div'); t.className = "tile";
        t.innerHTML = `<span class="jp">${item.jp}</span><span class="en">${item.en}</span>`;
        area.appendChild(t);
    });
}
function copyOutput() { navigator.clipboard.writeText(document.getElementById('output-area').value); }
function resetOutput() { document.getElementById('output-area').value = ""; }
refreshDisplay();
</script>
</body>
</html>
